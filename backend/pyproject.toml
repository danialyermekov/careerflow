[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diploma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "anthropic>=0.84.0",
    "catboost>=1.2.10",
    "fastapi>=0.136.1",
    "google-genai>=1.75.0",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pymupdf>=1.26.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.10,<3",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.11,<1",
    "pyright>=1.1.400,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = [
    "main",
]

[tool.setuptools.packages.find]
include = ["api", "api.*", "application", "application.*", "domain", "domain.*", "infrastructure", "infrastructure.*", "core", "core.*", "utils", "utils.*"]
exclude = ["tests", "tests.*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["api", "application", "core", "domain/ranking.py", "domain/chat_policy.py", "infrastructure/ml/artifacts.py", "main.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
