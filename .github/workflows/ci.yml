name: Release checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
        working-directory: backend
      - run: uv run --locked --extra dev python -m pytest --ignore=tests/test_recommendations.py
        working-directory: backend
      - name: Deployment safety tests (no Azure or production requests)
        run: uv run --locked --extra dev python -m unittest discover -s ../.github/scripts -p test_deploy.py
        working-directory: backend
      - run: uv run --locked --extra dev python -m ruff check . ../.github/scripts
        working-directory: backend
      - run: uv run --locked --extra dev python -m pyright
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test -- --runInBand
        working-directory: frontend
      - run: node --test scripts/check-auth-config.test.cjs
        working-directory: frontend
      - name: Build with public test fixtures (no production Auth or secrets)
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_SUPABASE_URL: https://build-fixture.supabase.co
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_fixture
